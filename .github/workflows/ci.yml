name: ci
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang-asan, linux-gcc-tsan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang python3 python3-pip
      - run: pip3 install --break-system-packages pytest pyyaml
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j 4
      - run: ctest --preset ${{ matrix.preset }}
        env:
          TSAN_OPTIONS: halt_on_error=0
          ASAN_OPTIONS: detect_leaks=0

  windows-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python mingw-w64-x86_64-python-pytest
      - run: cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build/mingw -j 4
      - run: ctest --test-dir build/mingw --output-on-failure

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: cmake --preset windows-msvc
      - run: cmake --build --preset windows-msvc -j 4
      - run: ctest --preset windows-msvc
